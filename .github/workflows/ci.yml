name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  api:
    name: API — lint / test / build / e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: serveiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/serveiq_test
      NODE_ENV: test
      CORS_ORIGIN: http://localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint runs but is NON-BLOCKING: the repo carries ~298 pre-existing
      # eslint errors (mostly `@typescript-eslint/no-unsafe-*` on `any` mocks
      # and prettier formatting that was never enforced, since no CI existed).
      # Gating on lint would block every PR. Tracked as H4 in
      # V1_COMMERCIAL_READINESS.md — to be flipped to a hard gate once debt is
      # paid down.
      - name: Lint (non-blocking, check only)
        run: npm run lint:ci -w apps/api
        continue-on-error: true

      - name: Unit & integration tests
        run: npm test -w apps/api -- --runInBand --no-cache

      - name: Build
        run: npm run build -w apps/api

      - name: E2E tests
        run: npm run test:e2e -w apps/api -- --runInBand --no-cache