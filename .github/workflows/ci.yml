name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  api-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Legacy lint debt (1583 errors) is tracked separately; do not block merges.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint -w apps/api
      - name: Unit tests
        run: npm run test -w apps/api -- --ci
      - name: Build
        run: npm run build -w apps/api

  e2e-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: serveiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/serveiq
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/serveiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Real-DB smoke (register -> tables -> menu -> tab -> order -> bill -> pay -> receipt)
        run: npm run test:e2e -w apps/api -- real-db