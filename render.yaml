services:
  - type: web
    name: serveiq-api
    env: node
    # Starter keeps the API always-on. The free tier sleeps after 15 min idle,
    # causing ~60s cold starts — unacceptable mid-service at a bar.
    plan: starter
    buildCommand: cd apps/api && rm -rf dist && npm install && npm run build
    startCommand: cd apps/api && npm run migration:run:prod; node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://serve-iq-one.vercel.app,https://serveiq-admin.vercel.app
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      # Required before boot: fail-fast validation will refuse to start without it.
      # Use the current JWT_SECRET value once to avoid breaking existing ciphertext.
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: serveiq-redis
          property: connectionString
      - key: NEMOTRON_API_KEY
        sync: false
      - key: NEMOTRON_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NEMOTRON_MODEL
        value: meta/llama-3.1-70b-instruct
  - type: redis
    name: serveiq-redis
    plan: free
    ipAllowList: []

databases:
  - name: serveiq-db
    databaseName: serveiq
    user: serveiq
    # Paid tier: the free Postgres plan suspends after inactivity, which would
    # take the API down mid-service. Smallest paid plan is sufficient for beta.
    plan: basic-256mb
    ipAllowList: []
